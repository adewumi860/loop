<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: black;">  
    <h3 style="color: white;font-size: 20px;font-family: sans-serif;"> An algorithm to display (browser) these from a range of 1 to 150:
- Fizz Buzz:
Divisible by 3 without any remainder - fizz
Divisible by 5 without any remainder - buzz
Divisible by 3 and 5 without any remainder - fizz buzz
No condition - neither fizz nor buzz
    </h3>
    <p id="demo"></p>
    <script>
        for(let i=1;i<=150;i++){
            if(i%3==0){
                document.write("<p style= 'color:green;'>" +i+ "      is divisible by 3 without any remainder - fizz"+"</p>")      
                if(i%5==0){
                document.write("<p style='color:red;'>" +i +"  is divisible by 5 without any remainder - buzz"+ "</p>")
            }if(i%15==0){
                document.write("<p style='color:blue;'>"+i+" is divisible by 3 and 5 without any remainder - fizz buzz"+ "</p>")
            }
            }        
        }
    </script>
</body>
</html>
